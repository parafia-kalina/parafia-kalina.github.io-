<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>parafia-kalina</title>

<style>
body {
    margin: 0;
    font-family: Arial;
}

/* MENU */
.nav {
    position: fixed;
    top: 0;
    width: 100%;
    background: black;
    color: white;
    padding: 15px;
    z-index: 1000;
}
.nav a {
    color: white;
    margin: 0 15px;
    text-decoration: none;
}


/* HERO */
.hero {
    margin-top: 60px;
    height: 400px;
    background: url("kosciol.webp.webp") center/cover no-repeat;
}

/* TYTUŁ */
.title {
    text-align: center;
    padding: 40px;
}

.title h1 {
    color: green;
}

/* KAFELKI */
.tiles {
    display: flex;
    gap: 20px;
    padding: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

.tile {
    width: 250px;
    height: 150px;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    color: white;
}

.tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.tile span {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 18px;
    background: rgba(0,0,0,0.5);
    padding: 5px;
}

/* BOCZNE PRZYCISKI */
.side {
    position: fixed;
    right: 0;
    top: 200px;
}

.side div {
    writing-mode: vertical-rl;
    padding: 10px;
    color: white;
    margin-bottom: 5px;
    font-weight: bold;
}

.green { background: green; }
.red { background: red; }
.blue { background: teal; }

</style>
</head>

<body>

<!-- MENU -->
<div class="nav">
    <a href="strona.html">START</a>
    <a href="aktualnosci.html">AKTUALNOŚCI</a>

    <a href="klasztor.html">KLASZTOR</a>
    <a href="multimedia.html">MULTIMEDIA</a>
    <a href="kontakt.html">KONTAKT</a>
</div>

<!-- ZDJĘCIE -->
<div class="hero"></div>

<!-- TYTUŁ -->
<div class="title">
    <h1>Parafia Rzymskokatolicka</h1>
    <h2>Wniebowzięcia NMP w Kalinie</h2>
</div>

<!-- KAFELKI -->
<div class="tiles">

    <a href="porzadek.html" class="tile">
        <img src="porzadek.png.png">
    </a>

    <a href="parafia.html" class="tile">
        <img src="historia.png.png">
        <span>Historia</span>
    </a>

    <a href="aktualnosci.html" class="tile">
        <img src="ogloszenia.png.png">
    </a>

    <a href="matkaboza.html" class="tile">
        <img src="mb.jpg.jpg">
        <span>Matka Boża</span>
    </a>

</div>

<!-- BOCZNE -->
<div class="side">
    <div class="green">Ofiara</div>
    <div class="red">Transmisja</div>
    <div class="blue">Pielgrzymi</div>
</div>

</body>
</html>
